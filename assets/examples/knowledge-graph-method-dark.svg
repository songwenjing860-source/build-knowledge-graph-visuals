    <text class="miniSub" x="1192" y="506">合并同义，保留关键差异</text>
    <path class="edgeSoft" d="M1145 500 C1070 520, 1005 535, 955 560"/>
  </g>
  <g>
    <rect class="node" x="690" y="740" width="250" height="105" rx="28" fill="#eff6ff"/>
