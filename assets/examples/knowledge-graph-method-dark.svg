    <text class="miniTitle" x="105" y="652">开始问题</text>
    <text class="miniSub" x="82" y="686">读者看完要会什么？</text>
    <path class="edgeSoft" d="M260 715 C300 740, 340 765, 398 790"/>
  </g>
  <g>
    <rect class="node" x="70" y="1010" width="270" height="105" rx="28" fill="#fdf2f8"/>
    <text class="miniTitle" x="136" y="1052">对抗审查</text>
    <text class="miniSub" x="98" y="1086">真实性、必要性、替代结构</text>
    <path class="edgeSoft" d="M290 1010 C330 970, 365 940, 398 940"/>
  </g>
  <g>
    <rect class="node" x="345" y="560" width="270" height="105" rx="28" fill="#fdf2f8"/>
    <text class="miniTitle" x="410" y="602">开源发布</text>
    <text class="miniSub" x="388" y="636">README + MIT + 示例</text>
    <path class="edgeSoft" d="M480 665 C465 715, 430 760, 398 790"/>
  </g>

  <!-- Bottom insight cards -->
  <g transform="translate(100,2230)">
    <rect x="0" y="0" width="1600" height="245" rx="40" fill="#0f172a" opacity=".92" stroke="#334155"/>
    <text class="smallWhite" x="58" y="66">这张图的核心判断：</text>
    <text class="smallWhite" x="58" y="116">知识图谱不是“把内容放进彩色框”，而是对知识关系作出可检查的编辑判断。</text>
    <text class="smallWhite" x="58" y="166">先建模，再布局；先验证，再公开。</text>
  </g>
</svg>
