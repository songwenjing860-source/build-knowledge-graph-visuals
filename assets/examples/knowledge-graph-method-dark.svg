<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2600" viewBox="0 0 1800 2600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#263246"/>
      <stop offset="42%" stop-color="#151d2b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.30  0 0 0 0 0.58  0 0 0 0 1.00  0 0 0 .55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <marker id="arrowCyan" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrowGold" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#fbbf24"/>
    </marker>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 70px; font-weight: 950; fill: #f8fafc; letter-spacing: 0; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 31px; fill: #cbd5e1; }
      .caption { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 24px; fill: #94a3b8; }
      .coreText { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 46px; font-weight: 950; fill: #ffffff; }
      .coreSub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 23px; fill: #e0f2fe; }
      .nodeTitle { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 30px; font-weight: 900; fill: #111827; }
      .nodeSub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 21px; fill: #334155; }
      .miniTitle { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 23px; font-weight: 850; fill: #0f172a; }
      .miniSub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #475569; }
      .edgeLabel { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 19px; font-weight: 800; fill: #e2e8f0; }
      .edgeLabelBg { fill: #111827; fill-opacity: .94; stroke: #334155; stroke-width: 1; }
      .legend { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 22px; fill: #e2e8f0; }
      .smallWhite { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 23px; fill: #f8fafc; }
      .edge { fill: none; stroke: #67e8f9; stroke-width: 3.2; stroke-opacity: .55; marker-end: url(#arrowCyan); }
      .edgeGold { fill: none; stroke: #fbbf24; stroke-width: 3.2; stroke-opacity: .62; marker-end: url(#arrowGold); }
      .edgeSoft { fill: none; stroke: #94a3b8; stroke-width: 2.3; stroke-opacity: .35; stroke-dasharray: 8 10; }
      .ring { fill: none; stroke: #ffffff; stroke-opacity: .08; stroke-width: 2; }
      .node { filter: url(#softShadow); stroke: rgba(255,255,255,.65); stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="2600" fill="url(#bg)"/>
  <circle class="ring" cx="900" cy="1250" r="410"/>
  <circle class="ring" cx="900" cy="1250" r="660"/>
  <circle class="ring" cx="900" cy="1250" r="850"/>

  <text class="title" x="100" y="130">知识图谱构建方法</text>
  <text class="subtitle" x="104" y="178">开放方法 · 双主题 · 可验证关系版</text>
  <text class="caption" x="104" y="222">读图方式：中心是构建目标，第一圈是关键步骤，外圈是原则、工具、风险与验收。</text>

  <!-- Legend -->
  <g transform="translate(100,270)">
    <rect x="0" y="0" width="1600" height="84" rx="28" fill="#0f172a" opacity=".82" stroke="#334155"/>
    <circle cx="48" cy="42" r="16" fill="url(#blueGrad)"/>
    <text class="legend" x="76" y="50">内容建模</text>
    <circle cx="250" cy="42" r="16" fill="url(#greenGrad)"/>
    <text class="legend" x="278" y="50">关系设计</text>
    <circle cx="452" cy="42" r="16" fill="url(#amberGrad)"/>
    <text class="legend" x="480" y="50">风险与删减</text>
    <circle cx="690" cy="42" r="16" fill="url(#violetGrad)"/>
    <text class="legend" x="718" y="50">质量验证</text>
    <circle cx="920" cy="42" r="16" fill="url(#pinkGrad)"/>
    <text class="legend" x="948" y="50">发布复用</text>
    <path d="M1200 42 H1285" class="edge"/>
    <text class="legend" x="1310" y="50">强关系</text>
    <path d="M1440 42 H1525" class="edgeSoft"/>
    <text class="legend" x="1540" y="50">弱关联</text>
  </g>

  <!-- Edges under nodes -->
  <path class="edgeGold" d="M900 705 C900 820, 900 910, 900 1034"/>
  <path class="edge" d="M1038 1110 C1160 1048, 1255 985, 1382 905"/>
  <path class="edge" d="M1045 1265 C1195 1288, 1320 1328, 1450 1410"/>
  <path class="edgeGold" d="M900 1466 C900 1585, 900 1668, 900 1792"/>
  <path class="edge" d="M762 1265 C616 1300, 502 1378, 380 1490"/>
  <path class="edge" d="M762 1110 C630 1045, 520 970, 398 865"/>

  <!-- Cross relationships -->
  <path class="edgeSoft" d="M398 865 C610 780, 705 780, 900 705"/>
  <path class="edgeSoft" d="M1382 905 C1240 1040, 1165 1150, 1038 1110"/>
  <path class="edgeSoft" d="M380 1490 C555 1595, 700 1690, 900 1792"/>
  <path class="edgeSoft" d="M1450 1410 C1258 1535, 1090 1660, 900 1792"/>
  <path class="edgeSoft" d="M900 705 C1110 800, 1240 1040, 1450 1410"/>
  <path class="edgeSoft" d="M398 865 C540 1120, 470 1310, 380 1490"/>

  <!-- Edge labels -->
  <g>
    <rect class="edgeLabelBg" x="909" y="841" width="90" height="40" rx="14"/>
    <text class="edgeLabel" x="925" y="868">定义目标</text>
  </g>
  <g>
    <rect class="edgeLabelBg" x="1015" y="954" width="170" height="40" rx="14"/>
    <text class="edgeLabel" x="1031" y="981">产出关系表</text>
  </g>
  <g>
    <rect class="edgeLabelBg" x="1075" y="1284" width="150" height="40" rx="14"/>
    <text class="edgeLabel" x="1091" y="1311">输出双主题</text>
  </g>
  <g>
    <rect class="edgeLabelBg" x="910" y="1622" width="110" height="40" rx="14"/>
    <text class="edgeLabel" x="926" y="1649">必须验证</text>
  </g>
  <g>
    <rect class="edgeLabelBg" x="526" y="1331" width="110" height="40" rx="14"/>
    <text class="edgeLabel" x="542" y="1358">暴露风险</text>
  </g>
  <g>
    <rect class="edgeLabelBg" x="496" y="971" width="110" height="40" rx="14"/>
    <text class="edgeLabel" x="512" y="998">支撑复用</text>
  </g>

  <!-- Center -->
  <g filter="url(#glow)">
    <circle cx="900" cy="1250" r="205" fill="url(#coreGrad)" stroke="#ffffff" stroke-opacity=".8" stroke-width="4"/>
    <circle cx="900" cy="1250" r="172" fill="#111827" opacity=".28"/>
  </g>
  <text class="coreText" x="785" y="1242">知识图谱</text>
  <text class="coreSub" x="742" y="1290">把内容变成可验证的知识关系</text>
  <text class="coreSub" x="755" y="1325">服务理解 / 复习 / 传播</text>

  <!-- First-ring nodes -->
  <g>
    <rect class="node" x="705" y="560" width="390" height="145" rx="38" fill="url(#blueGrad)"/>
    <text class="nodeTitle" x="760" y="622">读者任务</text>
    <text class="nodeSub" x="760" y="664">明确图要帮助谁做什么</text>
  </g>
  <g>
    <rect class="node" x="1195" y="790" width="395" height="150" rx="38" fill="url(#greenGrad)"/>
    <text class="nodeTitle" x="1250" y="852">实体与关系</text>
    <text class="nodeSub" x="1250" y="894">定义节点、方向与证据</text>
  </g>
  <g>
    <rect class="node" x="1245" y="1360" width="410" height="150" rx="38" fill="url(#greenGrad)"/>
    <text class="nodeTitle" x="1300" y="1422">双主题布局</text>
    <text class="nodeSub" x="1300" y="1464">共享坐标，切换视觉变量</text>
  </g>
  <g>
    <rect class="node" x="705" y="1790" width="390" height="150" rx="38" fill="url(#violetGrad)"/>
    <text class="nodeTitle" x="760" y="1852">质量验证</text>
    <text class="nodeSub" x="760" y="1894">内容、结构、可读性、导出</text>
  </g>
  <g>
    <rect class="node" x="210" y="1435" width="380" height="150" rx="38" fill="url(#amberGrad)"/>
    <text class="nodeTitle" x="265" y="1497">风险与删减</text>
    <text class="nodeSub" x="265" y="1539">删除装饰节点和无效连线</text>
  </g>
  <g>
    <rect class="node" x="215" y="790" width="365" height="150" rx="38" fill="url(#pinkGrad)"/>
    <text class="nodeTitle" x="270" y="852">复用与发布</text>
    <text class="nodeSub" x="270" y="894">沉淀 Skill、模板和脚本</text>
  </g>

  <!-- Outer mini nodes: input -->
  <g>
    <rect class="node" x="515" y="430" width="250" height="105" rx="28" fill="#eff6ff"/>
    <text class="miniTitle" x="562" y="472">中心命题</text>
    <text class="miniSub" x="562" y="506">一句可验证的核心判断</text>
    <path class="edgeSoft" d="M765 485 C815 500, 850 525, 900 560"/>
  </g>
  <g>
    <rect class="node" x="830" y="385" width="250" height="105" rx="28" fill="#eff6ff"/>
    <text class="miniTitle" x="877" y="427">证据来源</text>
    <text class="miniSub" x="877" y="461">文章、数据、定义、案例</text>
    <path class="edgeSoft" d="M955 490 C940 515, 920 535, 900 560"/>
  </g>
  <g>
    <rect class="node" x="1145" y="430" width="250" height="105" rx="28" fill="#eff6ff"/>
