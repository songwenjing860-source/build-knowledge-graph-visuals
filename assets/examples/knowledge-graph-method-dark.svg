    <text class="miniSub" x="728" y="816">读者价值与结构价值</text>
    <path class="edgeSoft" d="M820 740 C840 720, 860 708, 885 705"/>
  </g>

  <!-- Outer mini nodes: slot -->
  <g>
    <rect class="node" x="1275" y="610" width="250" height="105" rx="28" fill="#ecfdf5"/>
    <text class="miniTitle" x="1320" y="652">关系动词</text>
    <text class="miniSub" x="1320" y="686">依赖、导致、衡量、支撑</text>
    <path class="edgeSoft" d="M1400 715 C1395 745, 1390 770, 1382 790"/>
  </g>
  <g>
    <rect class="node" x="1520" y="980" width="230" height="105" rx="28" fill="#ecfdf5"/>
    <text class="miniTitle" x="1578" y="1022">强关系</text>
    <text class="miniSub" x="1558" y="1056">主叙事必须读得通</text>
    <path class="edgeSoft" d="M1520 1025 C1472 980, 1430 950, 1390 940"/>
  </g>
  <g>
    <rect class="node" x="1220" y="1010" width="230" height="105" rx="28" fill="#ecfdf5"/>
    <text class="miniTitle" x="1278" y="1052">弱关联</text>
    <text class="miniSub" x="1255" y="1086">辅助联系，降低视觉权重</text>
    <path class="edgeSoft" d="M1335 1010 C1345 980, 1360 955, 1382 940"/>
  </g>

  <!-- Outer mini nodes: mechanism -->
  <g>
    <rect class="node" x="1430" y="1620" width="260" height="105" rx="28" fill="#ecfdf5"/>
    <text class="miniTitle" x="1496" y="1662">SVG 母版</text>
    <text class="miniSub" x="1478" y="1696">文字准确、可编辑</text>
    <path class="edgeSoft" d="M1535 1620 C1510 1575, 1480 1535, 1450 1510"/>
  </g>
  <g>
    <rect class="node" x="1090" y="1575" width="260" height="105" rx="28" fill="#ecfdf5"/>
    <text class="miniTitle" x="1147" y="1617">黑底主题</text>
    <text class="miniSub" x="1133" y="1651">深色页面与演示</text>
    <path class="edgeSoft" d="M1310 1575 C1360 1545, 1402 1525, 1435 1510"/>
  </g>
  <g>
    <rect class="node" x="1240" y="1755" width="260" height="105" rx="28" fill="#ecfdf5"/>
    <text class="miniTitle" x="1297" y="1797">白底主题</text>
    <text class="miniSub" x="1278" y="1831">课程正文与打印</text>
    <path class="edgeSoft" d="M1370 1755 C1390 1665, 1420 1575, 1450 1510"/>
  </g>
  <g>
    <rect class="node" x="1515" y="1255" width="240" height="105" rx="28" fill="#ecfdf5"/>
    <text class="miniTitle" x="1560" y="1297">一致性校验</text>
    <text class="miniSub" x="1558" y="1331">文案、坐标、关系相同</text>
    <path class="edgeSoft" d="M1515 1310 C1490 1335, 1470 1352, 1450 1360"/>
  </g>

  <!-- Outer mini nodes: optimization -->
  <g>
    <rect class="node" x="55" y="1175" width="270" height="105" rx="28" fill="#fff7ed"/>
    <text class="miniTitle" x="113" y="1217">节点太多</text>
    <text class="miniSub" x="105" y="1251">先删减，再考虑拆图</text>
    <path class="edgeSoft" d="M245 1280 C275 1350, 315 1400, 380 1435"/>
  </g>
  <g>
    <rect class="node" x="45" y="1625" width="270" height="105" rx="28" fill="#fff7ed"/>
    <text class="miniTitle" x="114" y="1667">关系含混</text>
    <text class="miniSub" x="105" y="1701">不用“相关”掩盖问题</text>
    <path class="edgeSoft" d="M280 1625 C310 1600, 342 1584, 380 1585"/>
  </g>
  <g>
    <rect class="node" x="360" y="1675" width="270" height="105" rx="28" fill="#fff7ed"/>
    <text class="miniTitle" x="415" y="1717">装饰连线</text>
    <text class="miniSub" x="402" y="1751">删除没有信息价值的边</text>
    <path class="edgeSoft" d="M500 1675 C480 1625, 450 1590, 420 1585"/>
  </g>
  <g>
    <rect class="node" x="250" y="1835" width="270" height="105" rx="28" fill="#fff7ed"/>
    <text class="miniTitle" x="315" y="1877">小字陷阱</text>
    <text class="miniSub" x="296" y="1911">大像素不等于手机可读</text>
    <path class="edgeSoft" d="M385 1835 C390 1740, 395 1645, 400 1585"/>
  </g>

  <!-- Outer mini nodes: metric -->
  <g>
    <rect class="node" x="530" y="2035" width="260" height="105" rx="28" fill="#f5f3ff"/>
    <text class="miniTitle" x="590" y="2077">证据覆盖率</text>
    <text class="miniSub" x="575" y="2111">强关系均有依据</text>
    <path class="edgeSoft" d="M760 2035 C790 1990, 835 1950, 880 1940"/>
  </g>
  <g>
    <rect class="node" x="820" y="2090" width="260" height="105" rx="28" fill="#f5f3ff"/>
