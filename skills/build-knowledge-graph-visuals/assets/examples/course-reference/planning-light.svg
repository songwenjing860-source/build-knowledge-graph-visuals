<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3000" viewBox="0 0 1800 3000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="76%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="46%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </radialGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="48%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.30  0 0 0 0 0.58  0 0 0 0 1.00  0 0 0 .58 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#64748b" flood-opacity=".16"/>
    </filter>
    <marker id="arrowCyan" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#0891b2"/>
    </marker>
    <marker id="arrowGold" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#d97706"/>
    </marker>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 68px; font-weight: 950; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 30px; fill: #334155; }
      .caption { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 23px; fill: #64748b; }
      .coreText { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 43px; font-weight: 950; fill: #ffffff; }
      .coreSub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 21px; fill: #e0f2fe; }
      .nodeTitle { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 29px; font-weight: 900; fill: #111827; }
      .nodeSub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 20px; fill: #334155; }
      .miniTitle { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 22px; font-weight: 850; fill: #0f172a; }
      .miniSub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #475569; }
      .edgeLabel { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 800; fill: #334155; }
      .edgeLabelBg { fill: #ffffff; fill-opacity: .96; stroke: #cbd5e1; stroke-width: 1; }
      .legend { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 21px; fill: #334155; }
      .smallWhite { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 23px; fill: #334155; }
      .edge { fill: none; stroke: #0891b2; stroke-width: 3.2; stroke-opacity: .62; marker-end: url(#arrowCyan); }
      .edgeGold { fill: none; stroke: #d97706; stroke-width: 3.2; stroke-opacity: .68; marker-end: url(#arrowGold); }
      .edgeSoft { fill: none; stroke: #64748b; stroke-width: 2.2; stroke-opacity: .42; stroke-dasharray: 8 10; }
      .ring { fill: none; stroke: #94a3b8; stroke-opacity: .28; stroke-width: 2; }
      .node { filter: url(#softShadow); stroke: rgba(255,255,255,.68); stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="3000" fill="url(#bg)"/>
  <circle class="ring" cx="900" cy="1500" r="420"/>
  <circle class="ring" cx="900" cy="1500" r="690"/>
  <circle class="ring" cx="900" cy="1500" r="930"/>

  <text class="title" x="100" y="126">Agent 规划与执行知识图谱</text>
  <text class="subtitle" x="104" y="176">Agent 面试课 · 第二章 · Plan / Replan / TAO</text>
  <text class="caption" x="104" y="220">读图方式：中心是动态执行闭环，第一圈是六个核心模块，外圈是状态、机制、恢复策略与面试表达。</text>

