      .edgeLabelBg { fill: #ffffff; fill-opacity: .96; stroke: #cbd5e1; stroke-width: 1; }
      .legend { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 21px; fill: #334155; }
      .smallWhite { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 23px; fill: #1e293b; }
      .edge { fill: none; stroke: #0891b2; stroke-width: 3.2; stroke-opacity: .70; marker-end: url(#arrowCyan); }
      .edgeGold { fill: none; stroke: #d97706; stroke-width: 3.2; stroke-opacity: .76; marker-end: url(#arrowGold); }
      .edgeSoft { fill: none; stroke: #94a3b8; stroke-width: 2.2; stroke-opacity: .52; stroke-dasharray: 8 10; }
      .ring { fill: none; stroke: #64748b; stroke-opacity: .16; stroke-width: 2; }
      .node { filter: url(#softShadow); stroke: #ffffff; stroke-width: 2; }
