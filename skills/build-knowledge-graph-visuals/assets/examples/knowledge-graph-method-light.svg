<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2600" viewBox="0 0 1800 2600" data-layout-version="2" data-profile="poster-radial" data-theme="light">
<defs>
<linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fafc"/>
</linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset=".52" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".15"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 Z" fill="#0891b2"/></marker>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bbf7d0"/><stop offset="1" stop-color="#34d399"/></linearGradient>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ddd6fe"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbcfe8"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
</defs>
<style>
      text { font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif; }
      .title { fill:#0f172a; font-weight:900; font-size:72px; }
      .subtitle { fill:#475569; font-weight:600; font-size:32px; }
      .guide { fill:#64748b; font-size:25px; }
      .legend { fill:#475569; font-size:20px; font-weight:700; }
      .ring { fill:none; stroke:#dbe3ee; stroke-width:2; opacity:.72; }
      .edge { fill:none; stroke-linecap:round; }
      .edge.strong { stroke:#0891b2; stroke-width:3.2; opacity:.76; }
      .edge.weak { stroke:#94a3b8; stroke-width:2.2; stroke-dasharray:9 12; opacity:.52; }
      .edge-label-bg { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.5; }
      .edge-label { fill:#0f172a; font-size:19px; font-weight:800; }
      .node-shape { stroke:#ffffff; stroke-width:2; filter:url(#shadow); }
      .primary-shape { stroke-width:2.5; }
      .satellite-shape { opacity:.96; }
      .color-blue { fill:url(#blue); } .color-green { fill:url(#green); }
      .color-amber { fill:url(#amber); } .color-violet { fill:url(#violet); }
      .color-rose { fill:url(#rose); }
      .center-shape { fill:url(#core); stroke:#ffffff; stroke-width:5; filter:url(#shadow); }
      .node-title { fill:#0f172a; font-weight:900; }
      .node-sub { fill:#334155; font-weight:550; }
      .center-title,.center-sub { fill:#ffffff; }
      .center-sub { font-weight:650; }
      .footer-panel { fill:#ffffff; stroke:#dbe3ee; stroke-width:1.5; }
      .footer { fill:#475569; font-size:20px; }
      .source { fill:#64748b; font-size:17px; }
    </style>
<rect width="100%" height="100%" fill="url(#background)"/>
<text class="title" x="42" y="94">知识图谱构建方法</text>
<text class="subtitle" x="42" y="146">从原文证据到可验证关系，再到稳定的双主题视觉输出</text>
<text class="guide" x="42" y="190">中心是交付目标，第一圈是四个必要阶段，外圈是各阶段的质量闸门。</text>
<rect x="42" y="245" width="1716" height="88" rx="28" fill="#ffffff" stroke="#dbe3ee"/>
<circle cx="60" cy="295" r="11" fill="#60a5fa"/><text class="legend" x="81" y="302">内容建模</text>
<circle cx="212" cy="295" r="11" fill="#34d399"/><text class="legend" x="233" y="302">结构选择</text>
<circle cx="364" cy="295" r="11" fill="#a78bfa"/><text class="legend" x="385" y="302">确定渲染</text>
<circle cx="516" cy="295" r="11" fill="#f59e0b"/><text class="legend" x="537" y="302">质量验证</text>
<path d="M 668 295 h 46" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow)"/><text class="legend" x="729" y="302">强关系</text>
<path d="M 823 295 h 46" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 10"/><text class="legend" x="884" y="302">弱关联</text>
<ellipse class="ring" cx="900" cy="1370" rx="570" ry="570"/>
<ellipse class="ring" cx="900" cy="1370" rx="710" ry="815"/>
