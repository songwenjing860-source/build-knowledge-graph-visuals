<path data-role="edge" data-source="evidence" data-target="atomic" class="edge weak" data-evidence-id="ev-model" data-status="explicit" d="M 753.5 729.0 Q 719.2 712.4 685.0 695.8"/>
<path data-role="edge" data-source="evidence" data-target="verbs" class="edge weak" data-evidence-id="ev-model" data-status="explicit" d="M 1046.5 729.0 Q 1080.8 712.4 1115.0 695.8"/>
<path data-role="edge" data-source="core" data-target="gate" class="edge strong" data-evidence-id="ev-structure" data-status="explicit" d="M 1105.0 1370.0 Q 1192.5 1370.0 1280.0 1370.0" marker-end="url(#arrow)"/><g data-role="edge-label" data-edge-index="3"><rect class="edge-label-bg" x="1158.0" y="1351.0" width="76.0" height="38.0" rx="13"/><text class="edge-label" x="1196.0" y="1377.0" text-anchor="middle">决定</text></g>
<path data-role="edge" data-source="gate" data-target="cross" class="edge weak" data-evidence-id="ev-structure" data-status="explicit" d="M 1482.0 1299.0 Q 1502.9 1175.5 1523.8 1052.0"/>
<path data-role="edge" data-source="gate" data-target="split" class="edge weak" data-evidence-id="ev-structure" data-status="explicit" d="M 1482.0 1441.0 Q 1502.9 1564.5 1523.8 1688.0"/>
<path data-role="edge" data-source="core" data-target="template" class="edge strong" data-evidence-id="ev-render" data-status="explicit" d="M 900.0 1575.0 Q 900.0 1722.0 900.0 1869.0" marker-end="url(#arrow)"/><g data-role="edge-label" data-edge-index="6"><rect class="edge-label-bg" x="862.0" y="1708.9" width="76.0" height="38.0" rx="13"/><text class="edge-label" x="900.0" y="1734.9" text-anchor="middle">生成</text></g>
<path data-role="edge" data-source="template" data-target="themes" class="edge weak" data-evidence-id="ev-theme" data-status="explicit" d="M 1046.5 2011.0 Q 1080.8 2027.6 1115.0 2044.2"/>
<path data-role="edge" data-source="template" data-target="profiles" class="edge weak" data-evidence-id="ev-theme" data-status="explicit" d="M 753.5 2011.0 Q 719.2 2027.6 685.0 2044.2"/>
<path data-role="edge" data-source="core" data-target="qa" class="edge strong" data-evidence-id="ev-qa" data-status="explicit" d="M 695.0 1370.0 Q 607.5 1370.0 520.0 1370.0" marker-end="url(#arrow)"/><g data-role="edge-label" data-edge-index="9"><rect class="edge-label-bg" x="551.0" y="1351.0" width="106.0" height="38.0" rx="13"/><text class="edge-label" x="604.0" y="1377.0" text-anchor="middle">必须通过</text></g>
<path data-role="edge" data-source="qa" data-target="collision" class="edge weak" data-evidence-id="ev-qa" data-status="explicit" d="M 318.0 1441.0 Q 297.1 1564.5 276.2 1688.0"/>
<path data-role="edge" data-source="qa" data-target="regression" class="edge weak" data-evidence-id="ev-test" data-status="explicit" d="M 318.0 1299.0 Q 297.1 1175.5 276.2 1052.0"/>
<path data-role="edge" data-source="evidence" data-target="gate" class="edge strong" data-evidence-id="ev-structure" data-status="explicit" d="M 971.0 871.0 Q 1153.2 1116.8 1399.0 1299.0" marker-end="url(#arrow)"/><g data-role="edge-label" data-edge-index="12"><rect class="edge-label-bg" x="1105.7" y="1090.4" width="144.0" height="38.0" rx="13"/><text class="edge-label" x="1177.7" y="1116.4" text-anchor="middle">提供结构依据</text></g>
<path data-role="edge" data-source="template" data-target="qa" class="edge strong" data-evidence-id="ev-qa" data-status="explicit" d="M 829.0 1869.0 Q 646.8 1623.2 401.0 1441.0" marker-end="url(#arrow)"/><g data-role="edge-label" data-edge-index="13"><rect class="edge-label-bg" x="569.3" y="1611.6" width="106.0" height="38.0" rx="13"/><text class="edge-label" x="622.3" y="1637.6" text-anchor="middle">接受验证</text></g>
<path data-role="edge" data-source="qa" data-target="evidence" class="edge weak" data-evidence-id="ev-qa" data-status="explicit" d="M 401.0 1299.0 Q 551.4 1021.4 829.0 871.0"/>
</g>
<g id="nodes">
<g id="node-evidence" data-role="node" data-node-role="primary" data-node-id="evidence" data-group="model" data-evidence-id="ev-model" data-status="explicit" data-color="blue" data-x="710.0" data-y="729.0" data-width="380.0" data-height="142.0"><rect class="node-shape primary-shape color-blue" x="710.0" y="729.0" width="380.0" height="142.0" rx="34"/><text class="node-title primary-title" x="900.0" y="782.0" text-anchor="middle" style="font-size:31px">证据化建模</text><text class="node-sub primary-sub" x="900.0" y="825.0" text-anchor="middle" style="font-size:20px">节点和关系都能回到原文</text></g>
<g id="node-atomic" data-role="node" data-node-role="satellite" data-node-id="atomic" data-group="model" data-evidence-id="ev-model" data-status="explicit" data-color="blue" data-x="442.7" data-y="591.8" data-width="270.0" data-height="104.0"><rect class="node-shape satellite-shape color-blue" x="442.7" y="591.8" width="270.0" height="104.0" rx="27"/><text class="node-title satellite-title" x="577.7" y="625.8" text-anchor="middle" style="font-size:24px">原子节点</text><text class="node-sub satellite-sub" x="577.7" y="668.8" text-anchor="middle" style="font-size:20px">对象而不是目录标题</text></g>
<g id="node-verbs" data-role="node" data-node-role="satellite" data-node-id="verbs" data-group="model" data-evidence-id="ev-model" data-status="explicit" data-color="blue" data-x="1087.3" data-y="591.8" data-width="270.0" data-height="104.0"><rect class="node-shape satellite-shape color-blue" x="1087.3" y="591.8" width="270.0" height="104.0" rx="27"/><text class="node-title satellite-title" x="1222.3" y="625.8" text-anchor="middle" style="font-size:24px">关系动词</text><text class="node-sub satellite-sub" x="1222.3" y="668.8" text-anchor="middle" style="font-size:20px">能够读成完整判断</text></g>
<g id="node-gate" data-role="node" data-node-role="primary" data-node-id="gate" data-group="select" data-evidence-id="ev-structure" data-status="explicit" data-color="green" data-x="1280.0" data-y="1299.0" data-width="380.0" data-height="142.0"><rect class="node-shape primary-shape color-green" x="1280.0" y="1299.0" width="380.0" height="142.0" rx="34"/><text class="node-title primary-title" x="1470.0" y="1352.0" text-anchor="middle" style="font-size:31px">结构闸门</text><text class="node-sub primary-sub" x="1470.0" y="1395.0" text-anchor="middle" style="font-size:20px">图谱、流程、层级或矩阵</text></g>
<g id="node-cross" data-role="node" data-node-role="satellite" data-node-id="cross" data-group="select" data-evidence-id="ev-structure" data-status="explicit" data-color="green" data-x="1397.6" data-y="948.0" data-width="270.0" data-height="104.0"><rect class="node-shape satellite-shape color-green" x="1397.6" y="948.0" width="270.0" height="104.0" rx="27"/><text class="node-title satellite-title" x="1532.6" y="982.0" text-anchor="middle" style="font-size:24px">交叉关系</text><text class="node-sub satellite-sub" x="1532.6" y="1025.0" text-anchor="middle" style="font-size:20px">至少三条且有学习价值</text></g>
<g id="node-split" data-role="node" data-node-role="satellite" data-node-id="split" data-group="select" data-evidence-id="ev-structure" data-status="explicit" data-color="green" data-x="1397.6" data-y="1688.0" data-width="270.0" data-height="104.0"><rect class="node-shape satellite-shape color-green" x="1397.6" y="1688.0" width="270.0" height="104.0" rx="27"/><text class="node-title satellite-title" x="1532.6" y="1722.0" text-anchor="middle" style="font-size:24px">主动拆图</text><text class="node-sub satellite-sub" x="1532.6" y="1765.0" text-anchor="middle" style="font-size:20px">主线竞争时拒绝硬塞</text></g>
<g id="node-template" data-role="node" data-node-role="primary" data-node-id="template" data-group="render" data-evidence-id="ev-render" data-status="explicit" data-color="violet" data-x="710.0" data-y="1869.0" data-width="380.0" data-height="142.0"><rect class="node-shape primary-shape color-violet" x="710.0" y="1869.0" width="380.0" height="142.0" rx="34"/><text class="node-title primary-title" x="900.0" y="1922.0" text-anchor="middle" style="font-size:31px">固定布局档案</text><text class="node-sub primary-sub" x="900.0" y="1965.0" text-anchor="middle" style="font-size:20px">脚本拥有几何与配色</text></g>
<g id="node-themes" data-role="node" data-node-role="satellite" data-node-id="themes" data-group="render" data-evidence-id="ev-theme" data-status="explicit" data-color="violet" data-x="1087.3" data-y="2044.2" data-width="270.0" data-height="104.0"><rect class="node-shape satellite-shape color-violet" x="1087.3" y="2044.2" width="270.0" height="104.0" rx="27"/><text class="node-title satellite-title" x="1222.3" y="2078.2" text-anchor="middle" style="font-size:24px">双主题同构</text><text class="node-sub satellite-sub" x="1222.3" y="2121.2" text-anchor="middle" style="font-size:20px">只切换主题变量</text></g>
<g id="node-profiles" data-role="node" data-node-role="satellite" data-node-id="profiles" data-group="render" data-evidence-id="ev-theme" data-status="explicit" data-color="violet" data-x="442.7" data-y="2044.2" data-width="270.0" data-height="104.0"><rect class="node-shape satellite-shape color-violet" x="442.7" y="2044.2" width="270.0" height="104.0" rx="27"/><text class="node-title satellite-title" x="577.7" y="2078.2" text-anchor="middle" style="font-size:24px">两种密度</text><text class="node-sub satellite-sub" x="577.7" y="2121.2" text-anchor="middle" style="font-size:20px">poster 与 mobile 分离</text></g>
<g id="node-qa" data-role="node" data-node-role="primary" data-node-id="qa" data-group="verify" data-evidence-id="ev-qa" data-status="explicit" data-color="amber" data-x="140.0" data-y="1299.0" data-width="380.0" data-height="142.0"><rect class="node-shape primary-shape color-amber" x="140.0" y="1299.0" width="380.0" height="142.0" rx="34"/><text class="node-title primary-title" x="330.0" y="1352.0" text-anchor="middle" style="font-size:31px">可执行 QA</text><text class="node-sub primary-sub" x="330.0" y="1395.0" text-anchor="middle" style="font-size:20px">失败即停止而不是口头通过</text></g>
<g id="node-collision" data-role="node" data-node-role="satellite" data-node-id="collision" data-group="verify" data-evidence-id="ev-qa" data-status="explicit" data-color="amber" data-x="132.4" data-y="1688.0" data-width="270.0" data-height="104.0"><rect class="node-shape satellite-shape color-amber" x="132.4" y="1688.0" width="270.0" height="104.0" rx="27"/><text class="node-title satellite-title" x="267.4" y="1722.0" text-anchor="middle" style="font-size:24px">碰撞检查</text><text class="node-sub satellite-sub" x="267.4" y="1765.0" text-anchor="middle" style="font-size:20px">节点与安全区自动验证</text></g>
<g id="node-regression" data-role="node" data-node-role="satellite" data-node-id="regression" data-group="verify" data-evidence-id="ev-test" data-status="explicit" data-color="amber" data-x="132.4" data-y="948.0" data-width="270.0" data-height="104.0"><rect class="node-shape satellite-shape color-amber" x="132.4" y="948.0" width="270.0" height="104.0" rx="27"/><text class="node-title satellite-title" x="267.4" y="982.0" text-anchor="middle" style="font-size:24px">回归样例</text><text class="node-sub satellite-sub" x="267.4" y="1025.0" text-anchor="middle" style="font-size:20px">真实失败案例持续复测</text></g>
<g id="node-core" data-role="node" data-node-role="center" data-node-id="core" data-group="center" data-evidence-id="ev-model" data-status="explicit" data-color="violet" data-x="695.0" data-y="1165.0" data-width="410.0" data-height="410.0"><circle class="node-shape center-shape" cx="900.0" cy="1370.0" r="205.0"/><text class="node-title center-title" x="900.0" y="1352.0" text-anchor="middle" style="font-size:47px">可验证知识图谱</text><text class="node-sub center-sub" x="900.0" y="1395.0" text-anchor="middle" style="font-size:20px">关系成立 · 视觉稳定 · 可编辑交付</text></g>
</g>
<rect class="footer-panel" x="42" y="2260" width="1716" height="298" rx="34"/><text class="footer" x="84" y="2326">稳定的知识图谱不是每次重新设计，而是让内容变化、视觉系统保持不变。</text><text class="source" x="84" y="2530">示例：build-knowledge-graph-visuals v2 方法图。</text>
</svg>